<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vehicle preview</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Renders one vehicle the way the game assembles it: hull, wheels, rotors, turrets and guns placed from the layout.
// Query: ?name=fieldjeep&view=3q|side|front|top|rear&size=600&bg=0|1&spin=deg
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const q = new URLSearchParams(location.search);
const name = q.get('name'), view = q.get('view') || '3q', size = +(q.get('size') || 600);
const bg = q.get('bg') !== '0';
const base = 'assets/';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: !bg, preserveDrawingBuffer: true });
renderer.setSize(size, size);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (bg) scene.background = new THREE.Color(0x232833);

// Minecraft's entity lighting: two fixed directional lights and ambient
scene.add(new THREE.AmbientLight(0xffffff, 1.25));
const l0 = new THREE.DirectionalLight(0xffffff, 1.9); l0.position.set(0.2, 1.0, -0.7); scene.add(l0);
const l1 = new THREE.DirectionalLight(0xffffff, 1.9); l1.position.set(-0.2, 1.0, 0.7); scene.add(l1);

const [objText, layout] = await Promise.all([
  fetch(`${base}models/vehicle/vehicle_${name}.obj`).then(r => r.text()),
  fetch(`${base}vehicles/vehicle_${name}.json`).then(r => r.json()),
]);
const tex = await new THREE.TextureLoader().loadAsync(`${base}textures/models/vehicle_${name}.png`);
tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.colorSpace = THREE.SRGBColorSpace;
const lit = new THREE.MeshLambertMaterial({ map: tex, side: THREE.FrontSide });
const glow = new THREE.MeshBasicMaterial({ map: tex });
const obj = new OBJLoader().parse(objText);
const parts = {};
for (const m of obj.children) { m.material = m.name.endsWith('_glow') ? glow : lit; parts[m.name] = m; }

// model space (Java: y down, nose -z) -> world: rotate 180 about X
const root = new THREE.Group();
root.rotation.x = Math.PI;
root.scale.setScalar(layout.scale / 16);
scene.add(root);
function put(group, x, y, z, parent = root) {
  for (const n of [group, group + '_glow']) {
    if (!parts[n]) continue;
    const m = parts[n].clone(); m.position.set(x, y, z); parent.add(m);
  }
}
put('hull', 0, 0, 0);
(layout.wheels || []).forEach((w, i) => put('w' + i, w.x, w.y, w.z));
(layout.rotors || []).forEach((r, i) => put('r' + i, r.x, r.y, r.z));
(layout.turrets || []).forEach((t, i) => {
  const tg = new THREE.Group(); tg.position.set(t.x, t.y, t.z); root.add(tg);
  put('t' + i, 0, 0, 0, tg);
  put('g' + i, t.gx, t.gy, t.gz, tg);
});

const box = new THREE.Box3().setFromObject(root);
const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
const r = s.length() / 2;
const dirs = { '3q': [0.95, 0.62, 1.05], rear: [-0.95, 0.6, -1.05], side: [1, 0.08, 0], front: [0, 0.15, 1], top: [0.001, 1, 0.0] };
const d = new THREE.Vector3(...dirs[view]).normalize();
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 500);
cam.position.copy(c).addScaledVector(d, r / Math.sin(THREE.MathUtils.degToRad(12)) * 0.86);
cam.lookAt(c);
renderer.render(scene, cam);
document.title = 'done';
</script>
</body>
</html>
