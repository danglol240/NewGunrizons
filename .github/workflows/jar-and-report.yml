name: Jar and report

on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assemble 2>&1 | tee "$RUNNER_TEMP/assemble.log"
      - name: Apply spotless formatting
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew spotlessApply
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "spotlessApply"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Full check (spotless + tests)
        id: check
        continue-on-error: true
        run: ./gradlew --continue --stacktrace build -x assemble 2>&1 | tee "$RUNNER_TEMP/check.log"; exit ${PIPESTATUS[0]}
      - name: Report to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Jar and report (${GITHUB_SHA::7})"
            echo "check step: ${{ steps.check.outcome }}"
            echo
            echo "Jars:"
            ls -1 build/libs 2>/dev/null | sed 's/^/- /'
            echo
            echo '```'
            grep -nE "FAILED|What went wrong|violations|spotless|error:|Exception|> Task .*FAILED" "$RUNNER_TEMP/check.log" | head -60
            echo '---'
            tail -n 60 "$RUNNER_TEMP/check.log"
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -n "$pr" ] && gh pr comment "$pr" --body-file "$RUNNER_TEMP/report.md" || cat "$RUNNER_TEMP/report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NewGunrizons-${{ github.ref_name }}-jars
          path: build/libs/*.jar
