name: Jar and report

on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assemble 2>&1 | tee "$RUNNER_TEMP/assemble.log"
      - name: Apply spotless formatting
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew spotlessApply
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "spotlessApply"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Full check (spotless + tests)
        id: check
        continue-on-error: true
        run: ./gradlew --continue --stacktrace build -x assemble 2>&1 | tee "$RUNNER_TEMP/check.log"; exit ${PIPESTATUS[0]}
      - name: Server smoke test
        id: server
        continue-on-error: true
        run: |
          mkdir -p run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt
          echo "stop" > "$RUNNER_TEMP/stop.txt"
          timeout 240 ./gradlew --stacktrace runServer < "$RUNNER_TEMP/stop.txt" 2>&1 | tee "$RUNNER_TEMP/server.log" || true
          shopt -s nullglob
          crashes=(run/crash-reports/crash*.txt run/server/crash-reports/crash*.txt)
          if [ ${#crashes[@]} -gt 0 ]; then cp "${crashes[-1]}" "$RUNNER_TEMP/crash.txt"; exit 1; fi
          grep -qE 'Fatal errors were detected|forced into state SERVER_STOPPED|Exception stopping the server' "$RUNNER_TEMP/server.log" && exit 1
          grep -qP 'Done \(.+\)! For help' "$RUNNER_TEMP/server.log" || exit 1
      - name: Report to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Jar and report (${GITHUB_SHA::7})"
            echo "check step: ${{ steps.check.outcome }}"
            echo "server step: ${{ steps.server.outcome }}"
            echo
            echo "Jars:"
            ls -1 build/libs 2>/dev/null | sed 's/^/- /'
            echo
            echo '```'
            grep -nE "FAILED|What went wrong|violations|spotless|error:|Exception|> Task .*FAILED" "$RUNNER_TEMP/check.log" | head -60
            echo '---'
            tail -n 60 "$RUNNER_TEMP/check.log"
            echo '```'
            echo
            echo "#### Server"
            echo '```'
            if [ -f "$RUNNER_TEMP/crash.txt" ]; then head -n 80 "$RUNNER_TEMP/crash.txt"; fi
            grep -nE "ERROR|FATAL|Exception|Caused by|Done \(|newgunrizons" "$RUNNER_TEMP/server.log" | grep -v "^.*DEBUG" | head -80
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          [ -n "$pr" ] && gh pr comment "$pr" --body-file "$RUNNER_TEMP/report.md" || cat "$RUNNER_TEMP/report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NewGunrizons-${{ github.ref_name }}-jars
          path: build/libs/*.jar
