name: Release tagged build

# Builds the mod for a pushed tag and publishes a GitHub release that carries
# only the playable jar (no -dev or -sources jars).

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assemble
      - name: Pick the playable jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -vE -- '-(dev|sources|api)\.jar$')
          [ "$(echo "$jar" | wc -l)" = 1 ] || { echo "Expected one jar, got: $jar"; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Release jar: $jar"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp "release-notes/${GITHUB_REF_NAME}.md" "$notes"
          else
            echo "NewGunrizons ${GITHUB_REF_NAME}" > "$notes"
          fi
          gh release delete --yes "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "${{ steps.jar.outputs.path }}" \
            --title "NewGunrizons ${GITHUB_REF_NAME}" -F "$notes"
